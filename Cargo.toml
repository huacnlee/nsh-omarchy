[package]
name = "nsh-omarchy"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "An NSH component library designed for the Omarchy system and its UI and UX conventions"
repository = "https://github.com/huacnlee/nsh-omarchy"
readme = "README.md"
keywords = ["nsh", "omarchy", "ui", "components", "nshm"]
categories = ["gui"]
exclude = ["/examples", "/tests", "/docs", "/target", "/.claude", "/tsx", "/DESIGN.md"]

[workspace]

[lib]
name = "nsh_omarchy"

[dependencies]
nsh-core = "0.6.0"
nsh-base = "0.6.0"
log = "0.4"
toml = "0.8"
# Calendar days (`Date`); the version nsh-base uses.
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
# The exports tests read the set's TypeScript declarations.
nsh-core = { version = "0.6.0", features = ["declarations"] }
nsh-engine = { version = "0.6.0", default-features = false }
nsh-testing = { version = "0.6.0", default-features = false }
tempfile = "3"
