[package]
name = "nsh-omarchy"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "An NSH component library designed for the Omarchy system and its UI and UX conventions"
publish = false

[workspace]

[lib]
name = "nsh_omarchy"

[[bin]]
name = "nsh-omarchy-gallery"
path = "src/main.rs"

[dependencies]
nsh-core = "0.5.0"
nsh-base = "0.5.0"
env_logger = "0.11"
log = "0.4"
toml = "0.8"

[dev-dependencies]
# The exports tests read the set's TypeScript declarations.
nsh-core = { version = "0.5.0", features = ["declarations"] }
nsh-engine = { version = "0.5.0", default-features = false }
nsh-testing = { version = "0.5.0", default-features = false }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.5.0", default-features = false, features = ["shader", "editor", "highlight", "plot", "term"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.5.0", default-features = false, features = ["shader", "editor", "highlight", "plot", "term"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.5.0", default-features = false, features = ["shader", "editor", "highlight", "plot", "term"] }
