[package]
name = "nsh-omarchy-gallery"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The nsh-omarchy component gallery, a Rust NSH app"
publish = false

[workspace]

[lib]
name = "nsh_omarchy_gallery"

[[bin]]
name = "nsh-omarchy-gallery"
path = "src/main.rs"

[dependencies]
nsh-omarchy = { path = "../.." }
nsh-core = "0.6.0"
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.6.0", default-features = false, features = ["shader", "editor", "highlight", "plot", "term"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.6.0", default-features = false, features = ["shader", "editor", "highlight", "plot", "term"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.6.0", default-features = false, features = ["shader", "editor", "highlight", "plot", "term"] }
